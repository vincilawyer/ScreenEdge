<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">ScreenEdge passage diagram</title>
  <desc id="desc">Two local displays share a blue-green passage. An orange-red passage connects the external display to a schematic Universal Control destination. This is an explanatory diagram, not a screenshot or measured remote arrangement.</desc>
  <defs>
    <linearGradient id="cool"><stop stop-color="#1ADBA6" offset="0"/><stop stop-color="#0BABFF" offset=".5"/><stop stop-color="#4C47EB" offset="1"/></linearGradient>
    <linearGradient id="warm"><stop stop-color="#FFC714" offset="0"/><stop stop-color="#FF640F" offset=".5"/><stop stop-color="#E01A42" offset="1"/></linearGradient>
  </defs>
  <rect width="900" height="640" rx="24" fill="#F5F7FA"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="32" y="42" font-size="24" font-weight="650" fill="#172638">ScreenEdge</text>
    <text x="32" y="70" font-size="14" fill="#637184">See where your pointer can cross.</text>
    <rect x="400" y="97" width="270" height="100" rx="12" fill="#FFF2E8" stroke="#E78C58" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="535" y="139" text-anchor="middle" font-size="17" font-weight="600" fill="#B24C13">Universal Control</text>
    <text x="535" y="166" text-anchor="middle" font-size="13" fill="#8B7464">Schematic destination</text>
    <path d="M535 199 V245" fill="none" stroke="#DC762F" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="180" y="245" width="500" height="190" rx="12" fill="white" stroke="#BAC5D0" stroke-width="2"/>
    <text x="430" y="348" text-anchor="middle" font-size="18" fill="#243347">External display</text>
    <rect x="390" y="243" width="290" height="7" rx="3" fill="url(#warm)"/>
    <rect x="300" y="435" width="360" height="140" rx="12" fill="white" stroke="#BAC5D0" stroke-width="2"/>
    <text x="480" y="512" text-anchor="middle" font-size="18" fill="#243347">Built-in display</text>
    <rect x="300" y="429" width="360" height="5" rx="2" fill="url(#cool)"/>
    <rect x="300" y="436" width="360" height="5" rx="2" fill="url(#cool)"/>
    <rect x="180" y="607" width="45" height="6" rx="3" fill="url(#cool)"/>
    <text x="237" y="615" font-size="14" fill="#536174">Extended displays</text>
    <rect x="470" y="607" width="45" height="6" rx="3" fill="url(#warm)"/>
    <text x="527" y="615" font-size="14" fill="#536174">Universal Control</text>
  </g>
</svg>
