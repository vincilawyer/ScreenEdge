name: Build and test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Geometry and configuration checks
        run: ./scripts/test.sh
      - name: Build and verify app signature
        run: SCREENEDGE_ARCH="$(uname -m)" ./scripts/build.sh
